<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Examination Result</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .result-container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        .success-icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            margin-bottom: 10px;
            color: #222;
        }

        .candidate-name {
            font-size: 20px;
            color: #555;
            margin-bottom: 30px;
        }

        .score-box {
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .score {
            font-size: 48px;
            font-weight: bold;
            color: #2563eb;
            margin: 10px 0;
        }

        .percentage {
            font-size: 22px;
            color: #555;
        }

        .result-details {
            display: flex;
            justify-content: space-around;
            margin-top: 25px;
            gap: 15px;
        }

        .detail-box {
            flex: 1;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .detail-number {
            font-size: 25px;
            font-weight: bold;
        }

        .detail-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .message {
            margin-top: 25px;
            color: #555;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="result-container">

        <div class="success-icon">
            ✅
        </div>

        <h1>Examination Completed</h1>

        <div class="candidate-name">
            Candidate: <strong>{{ candidate_name }}</strong>
        </div>

        <div class="score-box">

            <div>Your Score</div>

            <div class="score">
                {{ score }} / {{ total_questions }}
            </div>

            <div class="percentage">
                {{ percentage }}%
            </div>

        </div>

        <div class="result-details">

            <div class="detail-box">

                <div class="detail-number">
                    {{ score }}
                </div>

                <div class="detail-label">
                    Correct Answers
                </div>

            </div>

            <div class="detail-box">

                <div class="detail-number">
                    {{ total_questions }}
                </div>

                <div class="detail-label">
                    Total Questions
                </div>

            </div>

        </div>

        <div class="message">
            Your examination has been submitted successfully.
        </div>

    </div>

</body>
</html>
