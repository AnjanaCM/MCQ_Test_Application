<body>

<div class="container">

```
<h1>TECH TANTRA SOLUTION</h1>

<h2>Candidate Details</h2>

{% if error %}
    <div class="error">
        {{ error }}
    </div>
{% endif %}

<div id="camera-message" class="camera-message"></div>

<div id="camera-success" class="camera-success">
    Camera access granted. Starting examination...
</div>

<form id="candidate-form" action="/candidate" method="POST">

    <label for="name">Full Name</label>

    <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your full name"
        pattern="[A-Za-z ]+"
        title="Name should contain letters and spaces only"
        required
    >

    <label for="email">Email Address</label>

    <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email address"
        required
    >

    <button
        type="submit"
        class="submit-btn"
        id="start-button"
    >
        Submit & Continue
    </button>

</form>
```

</div>

<script>

const form = document.getElementById("candidate-form");
const startButton = document.getElementById("start-button");
const cameraMessage = document.getElementById("camera-message");
const cameraSuccess = document.getElementById("camera-success");


function showCameraMessage(message) {
    cameraMessage.style.display = "block";
    cameraMessage.textContent = message;
}


function hideCameraMessage() {
    cameraMessage.style.display = "none";
}


function resetButton() {
    startButton.disabled = false;
    startButton.textContent = "Submit & Continue";
}


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    // ---------------------------------------------
    // STEP 1: CHECK FORM VALIDATION
    // ---------------------------------------------

    if (!form.checkValidity()) {
        form.reportValidity();
        return;
    }

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();

    startButton.disabled = true;
    startButton.textContent = "Checking Email...";

    hideCameraMessage();
    cameraSuccess.style.display = "none";


    // ---------------------------------------------
    // STEP 2: CHECK EMAIL FIRST
    // ---------------------------------------------

    try {

        const response = await fetch("/check_email", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email
            })
        });

        if (!response.ok) {
            throw new Error("Email verification failed.");
        }

        const result = await response.json();

        // Email already used
        if (!result.allowed) {

            showCameraMessage(result.message);

            resetButton();

            return;
        }

    } catch (error) {

        console.error("Email check error:", error);

        showCameraMessage(
            "Unable to verify the email. Please try again."
        );

        resetButton();

        return;
    }


    // ---------------------------------------------
    // STEP 3: NEW EMAIL → CAMERA CHECK
    // ---------------------------------------------

    startButton.textContent = "Checking Camera...";

    showCameraMessage(
        "Please allow camera access when your browser asks."
    );


    // ---------------------------------------------
    // STEP 4: CHECK CAMERA API
    // ---------------------------------------------

    if (
        !navigator.mediaDevices ||
        typeof navigator.mediaDevices.getUserMedia !== "function"
    ) {

        showCameraMessage(
            "Camera access is unavailable in this browser session. Please open this application in the latest Microsoft Edge or Google Chrome and make sure camera permission is enabled."
        );

        resetButton();

        return;
    }


    // ---------------------------------------------
    // STEP 5: REQUEST CAMERA
    // ---------------------------------------------

    try {

        console.log("Requesting camera permission...");

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
            });

        console.log("Camera permission granted.");

        // Show success
        hideCameraMessage();

        cameraSuccess.style.display = "block";

        startButton.textContent = "Camera Verified";


        // Stop temporary camera stream
        stream.getTracks().forEach(function(track) {
            track.stop();
        });


        // -----------------------------------------
        // STEP 6: SEND CANDIDATE DETAILS TO FLASK
        // -----------------------------------------

        setTimeout(function() {
            form.submit();
        }, 700);


    } catch (error) {

        console.error("Camera error:", error);
        console.error("Error name:", error.name);
        console.error("Error message:", error.message);


        let message =
            "Unable to access the camera.";


        if (error.name === "NotAllowedError") {

            message =
                "Camera permission was denied. Please allow camera access to attend the examination.";

        }
        else if (error.name === "NotFoundError") {

            message =
                "No camera was found on this device. Please connect a camera and try again.";

        }
        else if (error.name === "NotReadableError") {

            message =
                "The camera is already being used by another application. Please close other applications using the camera and try again.";

        }
        else if (error.name === "SecurityError") {

            message =
                "Camera access was blocked by the browser security settings.";

        }
        else if (error.name === "AbortError") {

            message =
                "Camera access was interrupted. Please try again.";

        }
        else {

            message =
                "Camera could not be accessed. Error: " +
                error.name;
        }


        showCameraMessage(message);

        resetButton();
    }

});

</script>
