<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: 100px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #1f3c88;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #333;
            font-size: 20px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        input:focus {
            border-color: #1f3c88;
            outline: none;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #1f3c88;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #162d66;
        }

        .submit-btn:disabled {
            background: #888;
            cursor: not-allowed;
        }

        .error {
            background: #ffe6e6;
            color: #c00;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }

        .camera-message {
            display: none;
            background: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>TECH TANTRA SOLUTION</h1>

        <h2>Candidate Details</h2>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <div id="camera-message" class="camera-message"></div>

        <form id="candidate-form" action="/candidate" method="POST">

            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                pattern="[A-Za-z ]+"
                title="Name should contain letters and spaces only"
                required
            >

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                required
            >

            <button
                type="submit"
                class="submit-btn"
                id="start-button"
            >
                Submit & Continue
            </button>

        </form>

    </div>

    <script>

        const form = document.getElementById("candidate-form");
        const startButton = document.getElementById("start-button");
        const cameraMessage = document.getElementById("camera-message");

        form.addEventListener("submit", async function(event) {

            // Stop the form from submitting immediately
            event.preventDefault();

            // Check HTML validation first
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            // Disable button while checking camera
            startButton.disabled = true;
            startButton.textContent = "Checking Camera...";

            cameraMessage.style.display = "block";
            cameraMessage.textContent =
                "Please allow camera access to attend the examination.";

            try {

                // Request camera permission
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });

                // Camera permission was granted
                console.log("Camera access granted.");

                // Stop this temporary camera stream.
                // The exam page will request the camera again for monitoring.
                stream.getTracks().forEach(track => track.stop());

                cameraMessage.style.display = "none";

                // Now allow the form to submit
                form.submit();

            } catch (error) {

                console.error("Camera access denied:", error);

                // Camera permission was denied or camera unavailable
                cameraMessage.style.display = "block";

                cameraMessage.textContent =
                    "Camera access is required to attend the examination. Please allow camera access and try again.";

                startButton.disabled = false;
                startButton.textContent = "Submit & Continue";
            }

        });

    </script>

</body>
</html>
